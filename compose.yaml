services:
  forex-agent:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FOREX_API_TOKEN: ${FOREX_API_TOKEN:?Set FOREX_API_TOKEN with at least 32 random characters}
    volumes:
      - journal:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  journal:
